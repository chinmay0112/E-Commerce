<p-carousel
  [value]="products"
  [numVisible]="1"
  [numScroll]="1"
  [circular]="true"
  autoplayInterval="5000"
>
  <ng-template let-product #item>
    <div class="border border-surface rounded-border">
      <div class="relative mx-auto">
        <img
          src="assets/images/{{ product.image }}"
          [alt]="product.name"
          class="w-full rounded-border"
        />
      </div>
    </div>
  </ng-template>
</p-carousel>
