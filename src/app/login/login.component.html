<app-header></app-header>
<app-inner-layout heading="Account"></app-inner-layout>
<div class="container py-8">
  <h2 class="text-center">Login</h2>
  <form>
    <div class="grid m-0">
      <div class="col-12 my-2">
        <p-floatlabel variant="on">
          <input
            class="w-full"
            pInputText
            id="on_label"
            [(ngModel)]="userName"
            name="userName"
            autocomplete="off"
          />
          <label for="on_label"
            >User Name or Email Address<span class="text-red-500"
              >*</span
            ></label
          >
        </p-floatlabel>
      </div>
      <div class="col-12 my-2">
        <p-floatlabel variant="on">
          <input
            class="w-full"
            pInputText
            id="on_label"
            [(ngModel)]="password"
            name="password"
            autocomplete="off"
          />
          <label for="on_label"
            >Password<span class="text-red-500">*</span></label
          >
        </p-floatlabel>
      </div>
    </div>
    <div class="col-12 text-center">
      <p-button label="Login" /><span>or</span
      ><a [routerLink]="['/register']" class="my-3 mx-2 inline-block"
        >Create an account</a
      >
    </div>
  </form>
</div>
